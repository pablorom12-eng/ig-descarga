name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Compilar APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Mostrar errores
        if: failure()
        run: |
          grep -E "error:|What went wrong|AAPT|Execution failed|\.java:[0-9]+" -A2 build.log | head -9 | sed 's/^/::error::/'
      - uses: actions/upload-artifact@v4
        with:
          name: IG-Descarga-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Descargas-APK
          path: yt/build/outputs/apk/debug/yt-debug.apk
